<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synergy — Live Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #334155; border-radius: 999px; transition: .2s; }
    .toggle-slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
    .toggle-switch input:checked + .toggle-slider { background: #2563eb; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }
    .toggle-switch input:disabled + .toggle-slider { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between p-4 md:p-6">

  <!-- TOP BAR -->
  <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
    <form id="auditForm" autocomplete="off" class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1">Business Name <span class="text-red-400">*</span></label>
        <input type="text" id="bizName" required autocomplete="off" placeholder="e.g. Bob's Plumbing"
               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1">City / State <span class="text-slate-500">(optional)</span></label>
        <input type="text" id="bizTown" autocomplete="off" placeholder="e.g. Branson, MO"
               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div class="flex items-end">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white font-semibold py-2.5 px-6 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 text-sm h-[42px]">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Run Live Audit</span>
        </button>
      </div>
    </form>
  </header>

  <!-- SEARCH ENGINES TOGGLE BAR -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
    <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
      <span class="text-xs font-bold tracking-widest text-slate-400 uppercase mr-2">Search Engines</span>
      <div id="engineToggles" class="flex flex-wrap items-center gap-x-6 gap-y-3"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <main class="flex-1 mb-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div id="resultsContainer">
        <div class="py-12 text-center text-slate-500 text-sm">
          <i class="fa-solid fa-magnifying-glass text-2xl mb-2 block"></i>
          Enter a business above and run the audit.
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('auditForm');
    form.addEventListener('submit', runAudit);

    // Every engine in the toggle bar. `match` is the exact lowercase label
    // the backend uses in its `source` field — must match exactly, or a
    // source falls through unmatched. Google Maps is locked ON: it's the
    // core identity lookup the backend needs internally.
    const ENGINES = [
      { match: 'google maps',             label: 'Google Maps', icon: 'fa-brands fa-google', color: '#4285F4', locked: true },
      { match: 'yelp',                    label: 'Yelp',        icon: 'fa-brands fa-yelp',   color: '#FF1A1A' },
      { match: 'facebook',                label: 'Facebook',    icon: 'fa-brands fa-facebook', color: '#1877F2' },
      { match: 'better business bureau',  label: 'BBB',         icon: 'fa-solid fa-building-shield', color: '#94a3b8' },
      { match: 'foursquare',              label: 'Foursquare',  icon: 'fa-solid fa-location-crosshairs', color: '#F94877' },
      { match: 'bing maps',               label: 'Bing Maps',   icon: 'fa-brands fa-microsoft', color: '#94a3b8' },
      { match: 'apple maps',              label: 'Apple Maps',  icon: 'fa-brands fa-apple', color: '#e2e8f0' },
    ];

    const engineState = {};
    ENGINES.forEach(e => { engineState[e.match] = true; });

    let loadingInterval = null;

    function renderEngineToggles() {
      const wrap = document.getElementById('engineToggles');
      wrap.innerHTML = ENGINES.map(e => `
        <label class="flex items-center gap-2 ${e.locked ? 'cursor-not-allowed' : 'cursor-pointer'}">
          <span class="toggle-switch">
            <input type="checkbox" data-engine="${e.match}" ${engineState[e.match] ? 'checked' : ''} ${e.locked ? 'disabled' : ''}>
            <span class="toggle-slider"></span>
          </span>
          <i class="${e.icon} text-sm" style="color:${e.color}"></i>
          <span class="text-sm text-slate-200">${e.label}${e.locked ? ' <span class=\'text-slate-500\'>(required)</span>' : ''}</span>
        </label>`).join('');

      wrap.querySelectorAll('input[data-engine]').forEach(input => {
        input.addEventListener('change', () => {
          engineState[input.dataset.engine] = input.checked;
        });
      });
    }
    renderEngineToggles();

    // Matches a backend `source` label back to its ENGINES entry.
    function engineMeta(sourceLabel) {
      const norm = (sourceLabel || '').toLowerCase().trim();
      return ENGINES.find(e => e.match === norm) || ENGINES.find(e => norm.includes(e.match)) || null;
    }

    // A source we don't recognize defaults to HIDDEN — toggles are a
    // reliable on/off switch, nothing unmapped sneaks into the table.
    function activeSources(sources) {
      return sources.filter(s => {
        const meta = engineMeta(s.source);
        return meta ? engineState[meta.match] : false;
      });
    }

    function enabledEngineList() {
      return ENGINES.filter(e => engineState[e.match]).map(e => e.match);
    }

    function startLoadingAnimation(container) {
      const messages = ENGINES.filter(e => engineState[e.match]).map(e => `Querying ${e.label}...`);
      if (messages.length === 0) messages.push('Querying...');
      let i = 0;
      container.innerHTML = `
        <div class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3 block"></i>
          <span id="loadingText">${escapeHtml(messages[0])}</span>
        </div>`;
      loadingInterval = setInterval(() => {
        i = (i + 1) % messages.length;
        const el = document.getElementById('loadingText');
        if (el) el.innerText = messages[i];
      }, 850);
    }

    function stopLoadingAnimation() {
      if (loadingInterval) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
    }

    async function runAudit(e) {
      if (e) e.preventDefault();

      const name = document.getElementById('bizName').value.trim();
      const town = document.getElementById('bizTown').value.trim();
      if (!name) return;

      const container = document.getElementById('resultsContainer');
      startLoadingAnimation(container);

      try {
        const response = await fetch('/api/audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, town, sources: enabledEngineList() })
        });

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          throw new Error(errBody.error || `Server error (${response.status})`);
        }

        const data = await response.json();
        stopLoadingAnimation();
        renderResults(data);

      } catch (err) {
        stopLoadingAnimation();
        container.innerHTML = `<div class="py-6 text-center text-red-400">Couldn't complete the audit: ${escapeHtml(err.message)}</div>`;
      }
    }

    // Exactly this and nothing else: one row per active engine, columns
    // for Name / Address / Phone / Hours — the raw value that engine
    // reported, or "Not found" / "Lookup failed". No verdicts, no extras.
    function renderResults(data) {
      const container = document.getElementById('resultsContainer');
      const sources = activeSources(data.sources || []);

      if (sources.length === 0) {
        container.innerHTML = `<div class="py-8 text-center text-slate-500 text-sm">No engines toggled on — flip a switch above to see results.</div>`;
        return;
      }

      const cell = (s, key) => {
        if (s.error) return `<span class="text-red-400 text-xs">Lookup failed</span>`;
        const value = s[key];
        return value
          ? `<span class="text-slate-100">${escapeHtml(value)}</span>`
          : `<span class="text-slate-500 italic">Not found</span>`;
      };

      const rows = sources.map(s => {
        const meta = engineMeta(s.source);
        const icon = meta ? meta.icon : 'fa-solid fa-globe';
        const color = meta ? meta.color : '#94a3b8';
        return `
          <tr>
            <th class="px-4 py-3 text-left text-sm font-semibold text-white whitespace-nowrap border-t border-slate-800/60">
              <span class="flex items-center gap-2">
                <i class="${icon} text-sm" style="color:${color}"></i>${escapeHtml(s.source)}
              </span>
            </th>
            <td class="px-4 py-3 text-sm align-top border-t border-slate-800/60">${cell(s, 'name')}</td>
            <td class="px-4 py-3 text-sm align-top border-t border-slate-800/60">${cell(s, 'address')}</td>
            <td class="px-4 py-3 text-sm align-top border-t border-slate-800/60">${cell(s, 'phone')}</td>
            <td class="px-4 py-3 text-sm align-top border-t border-slate-800/60">${cell(s, 'hours')}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full border-collapse">
            <thead>
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-400 whitespace-nowrap">Engine</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-400 whitespace-nowrap">Name</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-400 whitespace-nowrap">Address</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-400 whitespace-nowrap">Phone</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-slate-400 whitespace-nowrap">Hours</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
