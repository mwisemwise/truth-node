<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synergy — Live Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #334155; border-radius: 999px; transition: .2s; }
    .toggle-slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
    .toggle-switch input:checked + .toggle-slider { background: #2563eb; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }
    .diff-flag { color: #FF0000; background-color: #FFFF00; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between p-4 md:p-6">

  <!-- TOP BAR -->
  <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
    <form id="auditForm" autocomplete="off" class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1">Business Name <span class="text-red-400">*</span></label>
        <input type="text" id="bizName" required autocomplete="off" placeholder="e.g. Bob's Plumbing"
               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1">City / State <span class="text-slate-500">(optional)</span></label>
        <input type="text" id="bizTown" autocomplete="off" placeholder="e.g. Branson, MO"
               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div class="flex items-end">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white font-semibold py-2.5 px-6 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 text-sm h-[42px]">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Run Live Audit</span>
        </button>
      </div>
    </form>
  </header>

  <!-- SEARCH ENGINES TOGGLE BAR (input control — not part of the results layout) -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
    <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
      <span class="text-xs font-bold tracking-widest text-slate-400 uppercase mr-2">Search Engines</span>
      <div id="engineToggles" class="flex flex-wrap items-center gap-x-6 gap-y-3"></div>
    </div>
  </div>

  <!-- RESULTS: exactly 4 columns, nothing else -->
  <main class="flex-1 mb-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl">
      <div id="resultsMeta" class="hidden px-2 pb-2 text-xs text-slate-400"></div>
      <div id="resultsContainer">
        <div class="py-12 text-center text-slate-500 text-sm">
          <i class="fa-solid fa-magnifying-glass text-2xl mb-2 block"></i>
          Enter a business above and run the audit.
        </div>
      </div>
    </div>
  </main>

  <!-- PAST AUDITS: saved results you can reopen without re-running the search -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">Past Audits</span>
      <button onclick="loadAuditList()" class="text-xs text-slate-500 hover:text-slate-300">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
    <div id="pastAuditsList" class="text-xs text-slate-500">Loading...</div>
  </div>

  <script>
    const form = document.getElementById('auditForm');
    form.addEventListener('submit', runAudit);

    // `match` is the exact lowercase label the backend uses in its
    // `source` field — must match exactly. Every engine here is a normal
    // toggle; none are locked, per the strict exclusion requirement.
    const ENGINES = [
      { match: 'google maps',            label: 'Google Maps', icon: 'fa-brands fa-google', color: '#4285F4' },
      { match: 'yelp',                   label: 'Yelp',        icon: 'fa-brands fa-yelp',   color: '#FF1A1A' },
      { match: 'facebook',               label: 'Facebook',    icon: 'fa-brands fa-facebook', color: '#1877F2' },
      { match: 'better business bureau', label: 'BBB',         icon: 'fa-solid fa-building-shield', color: '#94a3b8' },
      { match: 'foursquare',             label: 'Foursquare',  icon: 'fa-solid fa-location-crosshairs', color: '#F94877' },
      { match: 'bing maps',              label: 'Bing Maps',   icon: 'fa-brands fa-microsoft', color: '#94a3b8' },
      { match: 'apple maps',             label: 'Apple Maps',  icon: 'fa-brands fa-apple', color: '#e2e8f0' },
    ];

    const engineState = {};
    ENGINES.forEach(e => { engineState[e.match] = true; });

    let loadingInterval = null;
    const FIELDS = ['address', 'phone', 'hours'];

    function renderEngineToggles() {
      const wrap = document.getElementById('engineToggles');
      wrap.innerHTML = ENGINES.map(e => `
        <label class="flex items-center gap-2 cursor-pointer">
          <span class="toggle-switch">
            <input type="checkbox" data-engine="${e.match}" ${engineState[e.match] ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </span>
          <i class="${e.icon} text-sm" style="color:${e.color}"></i>
          <span class="text-sm text-slate-200">${e.label}</span>
        </label>`).join('');

      wrap.querySelectorAll('input[data-engine]').forEach(input => {
        input.addEventListener('change', () => {
          engineState[input.dataset.engine] = input.checked;
        });
      });
    }
    renderEngineToggles();

    function engineMeta(sourceLabel) {
      const norm = (sourceLabel || '').toLowerCase().trim();
      return ENGINES.find(e => e.match === norm) || null;
    }

    // A source we don't recognize is excluded outright — toggles must be a
    // reliable on/off switch, nothing unmapped appears regardless of state.
    function activeSources(sources) {
      return sources.filter(s => {
        const meta = engineMeta(s.source);
        return meta ? engineState[meta.match] : false;
      });
    }

    function enabledEngineList() {
      return ENGINES.filter(e => engineState[e.match]).map(e => e.match);
    }

    function startLoadingAnimation(container) {
      const messages = ENGINES.filter(e => engineState[e.match]).map(e => `Querying ${e.label}...`);
      if (messages.length === 0) messages.push('Querying...');
      let i = 0;
      container.innerHTML = `
        <div class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3 block"></i>
          <span id="loadingText">${escapeHtml(messages[0])}</span>
        </div>`;
      loadingInterval = setInterval(() => {
        i = (i + 1) % messages.length;
        const el = document.getElementById('loadingText');
        if (el) el.innerText = messages[i];
      }, 850);
    }

    function stopLoadingAnimation() {
      if (loadingInterval) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
    }

    async function runAudit(e) {
      if (e) e.preventDefault();

      const name = document.getElementById('bizName').value.trim();
      const town = document.getElementById('bizTown').value.trim();
      if (!name) return;

      const container = document.getElementById('resultsContainer');
      startLoadingAnimation(container);

      try {
        const response = await fetch('/api/audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, town, sources: enabledEngineList() })
        });

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          throw new Error(errBody.error || `Server error (${response.status})`);
        }

        const data = await response.json();
        stopLoadingAnimation();

        const auditData = {
          ...data,
          business_name: name,
          town,
          audit_ran_at: new Date().toISOString()
        };
        sessionStorage.setItem('truthNodeAudit', JSON.stringify(auditData));

        if (data.audit_id) {
          window.location.href = `/results?audit_id=${encodeURIComponent(data.audit_id)}`;
        } else {
          window.location.href = '/results';
        }

      } catch (err) {
        stopLoadingAnimation();
        container.innerHTML = `<div class="py-6 text-center text-red-400">Couldn't complete the audit: ${escapeHtml(err.message)}</div>`;
      }
    }

    function showLiveMeta(name, town) {
      const meta = document.getElementById('resultsMeta');
      meta.classList.remove('hidden');
      meta.innerHTML = `<i class="fa-solid fa-bolt text-blue-400"></i> Live result — ${escapeHtml(name)}${town ? ', ' + escapeHtml(town) : ''}`;
    }

    function showSavedMeta(name, town, createdAt) {
      const meta = document.getElementById('resultsMeta');
      meta.classList.remove('hidden');
      const dateStr = new Date(createdAt).toLocaleString();
      meta.innerHTML = `<i class="fa-solid fa-clock-rotate-left text-slate-500"></i> Saved audit — ${escapeHtml(name)}${town ? ', ' + escapeHtml(town) : ''} — ${escapeHtml(dateStr)}`;
    }

    async function loadAuditList() {
      const list = document.getElementById('pastAuditsList');
      try {
        const res = await fetch('/api/audits');
        const data = await res.json();
        const audits = data.audits || [];

        if (data.error === 'Database not configured') {
          list.innerHTML = `<span class="text-slate-600">Audit history isn't set up on this server yet.</span>`;
          return;
        }
        if (audits.length === 0) {
          list.innerHTML = `<span class="text-slate-600">No saved audits yet — run one above.</span>`;
          return;
        }

        list.innerHTML = audits.map(a => `
          <button onclick="openSavedAudit(${a.id})"
                  class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-slate-800 flex items-center justify-between gap-3 text-slate-300">
            <span class="truncate">${escapeHtml(a.business_name)}${a.town ? ', ' + escapeHtml(a.town) : ''}</span>
            <span class="text-slate-500 whitespace-nowrap">${escapeHtml(new Date(a.created_at).toLocaleDateString())}</span>
          </button>`).join('');
      } catch (err) {
        list.innerHTML = `<span class="text-slate-600">Couldn't load audit history.</span>`;
      }
    }

    async function openSavedAudit(id) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `<div class="py-8 text-center text-slate-500 text-sm"><i class="fa-solid fa-circle-notch fa-spin"></i></div>`;
      try {
        const res = await fetch(`/api/audits/${id}`);
        if (!res.ok) throw new Error('Audit not found');
        const data = await res.json();
        document.getElementById('bizName').value = data.business_name || '';
        document.getElementById('bizTown').value = data.town || '';
        sessionStorage.setItem('truthNodeAudit', JSON.stringify(data));
        window.location.href = `/results?audit_id=${encodeURIComponent(id)}`;
      } catch (err) {
        container.innerHTML = `<div class="py-6 text-center text-red-400">Couldn't load that audit: ${escapeHtml(err.message)}</div>`;
      }
    }

    loadAuditList();

    function normalize(val) {
      return (val || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
    }

    // Baseline = the most common normalized value for this field among
    // active sources that actually have one. Ties break in favor of
    // whichever value appeared first. Returns null if fewer than 2 sources
    // have a value (nothing meaningful to compare).
    function computeBaseline(sources, key) {
      const counts = {};
      const original = {};
      let nonEmpty = 0;
      sources.forEach(s => {
        const raw = s[key];
        if (!raw) return;
        nonEmpty++;
        const norm = normalize(raw);
        if (!(norm in counts)) { counts[norm] = 0; original[norm] = raw; }
        counts[norm]++;
      });
      if (nonEmpty < 2) return null;
      let bestNorm = null, bestCount = -1;
      Object.entries(counts).forEach(([norm, count]) => {
        if (count > bestCount) { bestCount = count; bestNorm = norm; }
      });
      return { norm: bestNorm, original: original[bestNorm] };
    }

    // Word-level diff: returns HTML where the words present in `candidate`
    // but not in the baseline are wrapped in the red-text/yellow-highlight
    // span required by spec. Unchanged words render plain.
    function diffHtml(baseline, candidate) {
      if (typeof Diff === 'undefined' || !baseline) return escapeHtml(candidate);
      const parts = Diff.diffWords(baseline, candidate);
      return parts
        .filter(p => !p.removed)
        .map(p => p.added ? `<span class="diff-flag">${escapeHtml(p.value)}</span>` : escapeHtml(p.value))
        .join('');
    }

    function cellHtml(source, key, baseline) {
      if (source.error || !source[key]) {
        return `<span class="text-slate-500">N/A</span>`;
      }
      const value = source[key];
      if (!baseline || normalize(value) === baseline.norm) {
        return `<span class="text-slate-100">${escapeHtml(value)}</span>`;
      }
      return `<span class="text-slate-100">${diffHtml(baseline.original, value)}</span>`;
    }

    // Exactly 4 columns: Engine Name, Address, Phone, Hours. Nothing else.
    function renderResults(data) {
      const container = document.getElementById('resultsContainer');
      const sources = activeSources(data.sources || []);

      if (sources.length === 0) {
        container.innerHTML = `<div class="py-8 text-center text-slate-500 text-sm">No engines toggled on — flip a switch above to see results.</div>`;
        return;
      }

      const baselines = {};
      FIELDS.forEach(key => { baselines[key] = computeBaseline(sources, key); });

      const engineCell = s => s.url
        ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 hover:underline">${escapeHtml(s.source)}</a>`
        : escapeHtml(s.source);

      const rows = sources.map(s => `
        <tr>
          <th class="px-3 py-1.5 text-left text-xs font-semibold text-white whitespace-nowrap border-t border-slate-800/60">${engineCell(s)}</th>
          <td class="px-3 py-1.5 text-xs align-top border-t border-slate-800/60">${cellHtml(s, 'address', baselines.address)}</td>
          <td class="px-3 py-1.5 text-xs align-top border-t border-slate-800/60">${cellHtml(s, 'phone', baselines.phone)}</td>
          <td class="px-3 py-1.5 text-xs align-top border-t border-slate-800/60">${cellHtml(s, 'hours', baselines.hours)}</td>
        </tr>`).join('');

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-xs">
            <thead>
              <tr>
                <th class="px-3 py-1.5 text-left text-[11px] font-semibold text-slate-400 whitespace-nowrap">Engine Name</th>
                <th class="px-3 py-1.5 text-left text-[11px] font-semibold text-slate-400 whitespace-nowrap">Address</th>
                <th class="px-3 py-1.5 text-left text-[11px] font-semibold text-slate-400 whitespace-nowrap">Phone Number</th>
                <th class="px-3 py-1.5 text-left text-[11px] font-semibold text-slate-400 whitespace-nowrap">Hours</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
