<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synergy — Live Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between p-4 md:p-6 select-none">

  <!-- TOP BAR -->
  <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
    <form id="auditForm" autocomplete="off" class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1">Business Name <span class="text-red-400">*</span></label>
        <input type="text" id="bizName" required autocomplete="off" placeholder="e.g. Bob's Plumbing"
               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1">City / State <span class="text-slate-500">(optional)</span></label>
        <input type="text" id="bizTown" autocomplete="off" placeholder="e.g. Branson, MO"
               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div class="flex items-end">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all text-white font-semibold py-2.5 px-6 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 text-sm h-[42px]">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Run Live Audit</span>
        </button>
      </div>
    </form>
  </header>

  <!-- MAIN DISPLAY -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

    <div class="lg:col-span-1 flex flex-col gap-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <span class="text-xs font-bold tracking-widest text-slate-400 uppercase mb-3 block">Sources Checked</span>
        <div id="sourceCountList" class="flex flex-col gap-2 text-sm text-slate-300">
          <span class="text-slate-500">Enter a business and run the audit.</span>
        </div>
      </div>

      <div class="bg-purple-950/40 border border-purple-500/30 rounded-2xl p-5 shadow-xl flex items-start gap-4">
        <div class="p-3 bg-purple-500/20 text-purple-400 rounded-xl">
          <i class="fa-solid fa-ghost text-2xl"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-purple-200">Ghost Profile Monitor</h3>
          <p id="ghostAlertText" class="text-xs text-purple-300/80 mt-1 leading-relaxed">
            Flags duplicate or unmanaged listings sitting alongside the main one.
          </p>
        </div>
      </div>
    </div>

    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between gap-6">
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-network-wired text-blue-500"></i>
            What Each Source Reports
          </h2>
          <span class="text-xs text-slate-400">Live</span>
        </div>

        <div id="categoryContainer" class="mt-4 flex flex-col gap-6">
          <div class="py-12 text-center text-slate-500 text-sm">
            <i class="fa-solid fa-magnifying-glass text-2xl mb-2 block"></i>
            Enter a business above and run the audit.
          </div>
        </div>
      </div>

      <button onclick="showLockNotice()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-98 transition-all text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-3 text-lg">
        <i class="fa-solid fa-shield-halved text-xl"></i>
        <span>Lock Certified Record & Clear Ghost Profiles</span>
      </button>
    </div>

  </main>

  <script>
    const form = document.getElementById('auditForm');
    form.addEventListener('submit', runAudit);

    const CATEGORIES = [
      { key: 'name', label: 'Business Name', icon: 'fa-solid fa-signature' },
      { key: 'address', label: 'Address', icon: 'fa-solid fa-location-dot' },
      { key: 'phone', label: 'Phone', icon: 'fa-solid fa-phone' },
      { key: 'email', label: 'Email', icon: 'fa-solid fa-envelope' },
    ];

    async function runAudit(e) {
      if (e) e.preventDefault();

      const name = document.getElementById('bizName').value.trim();
      const town = document.getElementById('bizTown').value.trim();
      if (!name) return;

      const container = document.getElementById('categoryContainer');
      const countList = document.getElementById('sourceCountList');

      container.innerHTML = `
        <div class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3 block"></i>
          Querying live directories for "${escapeHtml(name)}"...
        </div>`;
      countList.innerHTML = `<span class="text-slate-500">Searching...</span>`;

      try {
        const response = await fetch('/api/audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, town })
        });

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          throw new Error(errBody.error || `Server error (${response.status})`);
        }

        const data = await response.json();
        renderResults(data);

      } catch (err) {
        container.innerHTML = `<div class="py-6 text-center text-red-400">Couldn't complete the audit: ${escapeHtml(err.message)}</div>`;
        countList.innerHTML = '';
      }
    }

    function renderResults(data) {
      const container = document.getElementById('categoryContainer');
      const countList = document.getElementById('sourceCountList');
      container.innerHTML = '';

      const sources = data.sources || [];
      const foundCount = sources.filter(s => s.name || s.address || s.phone || s.email).length;

      countList.innerHTML = `
        <div class="flex items-center justify-between">
          <span>Sources queried</span><span class="font-bold text-white">${sources.length}</span>
        </div>
        <div class="flex items-center justify-between">
          <span>Found something</span><span class="font-bold text-white">${foundCount}</span>
        </div>`;

      CATEGORIES.forEach(cat => {
        const rows = sources.map(s => {
          const value = s[cat.key];
          const hasError = !!s.error;
          const displayValue = hasError
            ? `<span class="text-red-400">Lookup failed: ${escapeHtml(s.error)}</span>`
            : value
              ? `<span class="text-slate-100">${escapeHtml(value)}</span>`
              : `<span class="text-slate-500 italic">Not found here</span>`;

          return `
            <div class="flex items-start justify-between gap-4 py-2.5 border-b border-slate-800/60 last:border-b-0">
              <div class="flex items-center gap-2.5 w-40 shrink-0">
                <i class="${s.icon} text-slate-400 w-4 text-center text-sm"></i>
                <span class="text-sm font-medium text-slate-300">${escapeHtml(s.source)}</span>
              </div>
              <div class="flex-1 text-sm text-right">${displayValue}</div>
            </div>`;
        }).join('');

        container.innerHTML += `
          <div>
            <div class="flex items-center gap-2 mb-1">
              <i class="${cat.icon} text-blue-500 text-sm"></i>
              <h3 class="text-sm font-bold text-white uppercase tracking-wide">${cat.label}</h3>
            </div>
            <div class="bg-slate-800/40 rounded-xl px-4">${rows}</div>
          </div>`;
      });

      const ghosts = data.ghosts || [];
      const ghostAlert = document.getElementById('ghostAlertText');
      ghostAlert.innerText = ghosts.length > 0
        ? `${ghosts.length} unmanaged duplicate listing(s) found: ${ghosts.map(g => g.address).join('; ')}`
        : `No duplicate or ghost listings detected.`;
    }

    function showLockNotice() {
      alert("Certified Record locking isn't built yet — that's the next phase (the actual hosted Synergy page). This button is a placeholder for the pitch, not a working feature.");
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
